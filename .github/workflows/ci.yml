name: Build & Test MAUI App

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET MAUI Workloads
        run: |
          dotnet workload install maui-android maui-ios

      - name: Restore Dependencies (from nuget.org)
        run: |
          dotnet restore VBotMauiApp/VBotMauiApp.csproj

      - name: Build Android App
        run: |
          dotnet build VBotMauiApp/VBotMauiApp.csproj -f net9.0-android -c Release --no-restore

      - name: Build iOS App
        run: |
          dotnet build VBotMauiApp/VBotMauiApp.csproj -f net9.0-ios -c Release --no-restore -p:ValidateXcodeVersion=false
