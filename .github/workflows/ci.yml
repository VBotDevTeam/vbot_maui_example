name: Build & Test MAUI App

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET MAUI Workloads
        run: |
          dotnet workload install maui-android maui-ios

      - name: Restore Dependencies (from nuget.org)
        run: |
          dotnet restore VBotMauiApp/VBotMauiApp.csproj

      - name: Build Android App
        run: |
          dotnet build VBotMauiApp/VBotMauiApp.csproj -f net9.0-android -c Release --no-restore

      - name: Build iOS App (Simulator)
        run: |
          dotnet build VBotMauiApp/VBotMauiApp.csproj -f net9.0-ios -c Release --no-restore -p:RuntimeIdentifier=iossimulator-arm64 -p:EnableCodeSigning=false
